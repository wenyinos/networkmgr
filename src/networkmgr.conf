
notify 5 {
	match "system"		"IFNET";
	match "subsystem"	"!(usbus|wlan)[0-9]+";
	match "type"		"ATTACH";
	action "/usr/local/bin/networkmgr-devd attach $subsystem";
};

notify 5 {
	match "system"		"IFNET";
	match "type"		"LINK_UP";
	media-type		"ethernet";
	action "/usr/local/bin/networkmgr-devd link-up $subsystem";
};

notify 5 {
	match "system"		"IFNET";
	match "subsystem"	"!(usbus|wlan)[0-9]+";
	match "type"		"LINK_DOWN";
	action "/usr/local/bin/networkmgr-devd link-down $subsystem";
};

attach 5 {
	device-name "$wifi-driver-regex";
	action "/usr/local/bin/networkmgr-devd attach $device-name";
};
