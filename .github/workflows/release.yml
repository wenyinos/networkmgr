name: Release

# 推送 v* tag 或手动触发：在 FreeBSD 上构建 amd64/aarch64 的 .pkg，
# 然后直接创建 GitHub Release 并上传两个包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Which architecture to package (amd64 / aarch64 / both)'
        required: false
        default: both
        type: choice
        options: [both, amd64, aarch64]

permissions:
  contents: write

env:
  VERSION: 0.1.0
  PKG_NAME: networkmgr

jobs:
  build-amd64:
    name: Package amd64
    if: ${{ inputs.arch == '' || inputs.arch == 'both' || inputs.arch == 'amd64' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and package on FreeBSD 15.1 (amd64)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          sync: rsync
          envs: VERSION
          prepare: |
            pkg install -y rust pkgconf gtk3 libayatana-appindicator \
              mesa-dri fontconfig wqy-fonts gettext-tools
          run: |
            set -eu
            VERSION="${VERSION:-0.1.0}"
            REPO_ROOT=$(pwd)
            cd rust
            CARGO_TARGET_DIR=/tmp/nm-core cargo build --release --locked \
              --bin dump-state --bin apply-config --bin networkmgr-devd
            cd spikes
            CARGO_TARGET_DIR=/tmp/nm-spikes cargo build --release --locked --bins
            mkdir -p /tmp/nm-bin
            cp /tmp/nm-core/release/dump-state \
               /tmp/nm-core/release/apply-config \
               /tmp/nm-core/release/networkmgr-devd \
               /tmp/nm-bin/
            cp /tmp/nm-spikes/release/networkmgr \
               /tmp/nm-spikes/release/config-window \
               /tmp/nm-bin/
            cd "$REPO_ROOT"
            BUILD_DIR=/tmp/nm-bin REPO_ROOT="$REPO_ROOT" VERSION="${VERSION}" \
              OUT_DIR=artifacts sh .github/scripts/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: networkmgr-pkg-amd64
          path: artifacts/*.pkg
          if-no-files-found: error

  build-aarch64:
    name: Package aarch64
    # 手动触发时可选只跑 amd64：arm64 上跑 FreeBSD VM 实测要 46 分钟以上，
    # 卡住时不能让它拖住 amd64 的发布。单独补包时给足时间，避免又被取消。
    if: ${{ inputs.arch == '' || inputs.arch == 'both' || inputs.arch == 'aarch64' }}
    timeout-minutes: 150
    # 公开仓库可用的 arm64 托管 runner；同架构跑 FreeBSD arm64 VM，
    # 比在 x86 runner 上做 TCG 跨架构模拟快得多。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build and package on FreeBSD 15.1 (aarch64)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: aarch64
          sync: rsync
          envs: VERSION
          prepare: |
            pkg install -y rust pkgconf gtk3 libayatana-appindicator \
              mesa-dri fontconfig wqy-fonts gettext-tools
          run: |
            set -eu
            VERSION="${VERSION:-0.1.0}"
            REPO_ROOT=$(pwd)
            cd rust
            CARGO_TARGET_DIR=/tmp/nm-core cargo build --release --locked \
              --bin dump-state --bin apply-config --bin networkmgr-devd
            cd spikes
            CARGO_TARGET_DIR=/tmp/nm-spikes cargo build --release --locked --bins
            mkdir -p /tmp/nm-bin
            cp /tmp/nm-core/release/dump-state \
               /tmp/nm-core/release/apply-config \
               /tmp/nm-core/release/networkmgr-devd \
               /tmp/nm-bin/
            cp /tmp/nm-spikes/release/networkmgr \
               /tmp/nm-spikes/release/config-window \
               /tmp/nm-bin/
            cd "$REPO_ROOT"
            BUILD_DIR=/tmp/nm-bin REPO_ROOT="$REPO_ROOT" VERSION="${VERSION}" \
              OUT_DIR=artifacts sh .github/scripts/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: networkmgr-pkg-aarch64
          path: artifacts/*.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # 任一架构成功就发布：单独补 aarch64 时 amd64 是被跳过（skipped）而不是失败。
    needs: [build-amd64, build-aarch64]
    if: ${{ always() && (needs.build-amd64.result == 'success' || needs.build-aarch64.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: networkmgr-pkg-amd64
          path: pkg/amd64

      - uses: actions/download-artifact@v4
        with:
          name: networkmgr-pkg-aarch64
          path: pkg/aarch64
        continue-on-error: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "NetworkMgr ${VERSION}" \
              --notes-file docs/RELEASE-0.1.0.md
          fi
          shopt -s nullglob
          files=(pkg/*/*.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .pkg produced" >&2
            exit 1
          fi
          printf 'uploading %d package(s)\n' "${#files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
