name: Release

# 推送 v* tag 或手动触发：在 FreeBSD 上构建 amd64/aarch64 的 .pkg，
# 然后直接创建 GitHub Release 并上传两个包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.1.0
  PKG_NAME: networkmgr

jobs:
  build-amd64:
    name: Package amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and package on FreeBSD 15.1 (amd64)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          sync: rsync
          envs: VERSION
          prepare: |
            pkg install -y rust pkgconf gtk3 libayatana-appindicator \
              mesa-dri fontconfig wqy-fonts gettext-tools
          run: |
            set -eu
            VERSION="${VERSION:-0.1.0}"
            cd rust
            CARGO_TARGET_DIR=/tmp/nm-core cargo build --release --locked \
              --bin dump-state --bin apply-config --bin networkmgr-devd
            cd spikes
            CARGO_TARGET_DIR=/tmp/nm-spikes cargo build --release --locked --bins
            mkdir -p /tmp/nm-bin
            cp /tmp/nm-core/release/dump-state \
               /tmp/nm-core/release/apply-config \
               /tmp/nm-core/release/networkmgr-devd \
               /tmp/nm-bin/
            cp /tmp/nm-spikes/release/networkmgr \
               /tmp/nm-spikes/release/config-window \
               /tmp/nm-bin/
            cd ..
            BUILD_DIR=/tmp/nm-bin REPO_ROOT=$(pwd) VERSION="${VERSION}" \
              OUT_DIR=artifacts sh .github/scripts/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: networkmgr-pkg-amd64
          path: artifacts/*.pkg
          if-no-files-found: error

  build-aarch64:
    name: Package aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and package on FreeBSD 15.1 (aarch64)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: aarch64
          sync: rsync
          envs: VERSION
          prepare: |
            pkg install -y rust pkgconf gtk3 libayatana-appindicator \
              mesa-dri fontconfig wqy-fonts gettext-tools
          run: |
            set -eu
            VERSION="${VERSION:-0.1.0}"
            cd rust
            CARGO_TARGET_DIR=/tmp/nm-core cargo build --release --locked \
              --bin dump-state --bin apply-config --bin networkmgr-devd
            cd spikes
            CARGO_TARGET_DIR=/tmp/nm-spikes cargo build --release --locked --bins
            mkdir -p /tmp/nm-bin
            cp /tmp/nm-core/release/dump-state \
               /tmp/nm-core/release/apply-config \
               /tmp/nm-core/release/networkmgr-devd \
               /tmp/nm-bin/
            cp /tmp/nm-spikes/release/networkmgr \
               /tmp/nm-spikes/release/config-window \
               /tmp/nm-bin/
            cd ..
            BUILD_DIR=/tmp/nm-bin REPO_ROOT=$(pwd) VERSION="${VERSION}" \
              OUT_DIR=artifacts sh .github/scripts/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: networkmgr-pkg-aarch64
          path: artifacts/*.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-amd64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: pkg

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "NetworkMgr ${VERSION}" \
              --notes-file docs/RELEASE-0.1.0.md
          fi
          gh release upload "$TAG" \
            pkg/networkmgr-pkg-amd64/*.pkg \
            pkg/networkmgr-pkg-aarch64/*.pkg \
            --clobber
